name: Configure GitHub repository About

# Owner-run only. The token with Administration: write is intentionally
# not made available to automatically triggered builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-repository-about
  cancel-in-progress: false

jobs:
  update-about:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update description and topics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GPT20_REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing GPT20_REPO_ADMIN_TOKEN. Create a fine-grained PAT scoped to this repository with Administration: write and save it as an Actions repository secret."
            echo "::error::The default GITHUB_TOKEN failed with HTTP 403 on the first run; it cannot update repository About."
            exit 1
          fi
          bash scripts/configure-repository-about.sh

      - name: Verify public About metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GPT20_REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{description: .description, topics: .topics}'
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.description' |
            grep -Fx "Multilingual Android Twenty Questions game powered by ChatGPT via SIWC. Choose your role, language, model and reasoning effort; play up to 20 turns."
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.topics[]' |
            grep -Fx "sign-in-with-chatgpt"

# GitHub repository administration is not a configurable GITHUB_TOKEN
# permission. If the workflow token is refused, create a fine-grained
# PAT restricted to this single repository, with Administration: write,
# and save it under Settings > Secrets and variables > Actions as
# GPT20_REPO_ADMIN_TOKEN. Never store the PAT in Git.
